# Cloudflare Tunnel → http://127.0.0.1:118
# Frontend Next.js :117 | Django gunicorn :116
worker_processes 1;
error_log /home/sas/HotelERP/deploy/nginx-118.error.log warn;
pid /home/sas/HotelERP/deploy/nginx-118.pid;

events {
  worker_connections 1024;
}

http {
  access_log /home/sas/HotelERP/deploy/nginx-118.access.log;
  client_max_body_size 50m;
  proxy_read_timeout 120s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 118;
    listen [::]:118;
    server_name turag.sascorporationbd.com _;

    location /api/ {
      proxy_pass http://127.0.0.1:116;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
      proxy_pass http://127.0.0.1:116;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
      proxy_pass http://127.0.0.1:116;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /media/ {
      proxy_pass http://127.0.0.1:116;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
      proxy_pass http://127.0.0.1:117;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
